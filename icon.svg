<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#1c499c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#2c3645"/>
      <stop offset="100%" stop-color="#090c12"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Washer Body -->
  <rect x="106" y="86" width="300" height="340" rx="36" fill="url(#body)" stroke="#ffffff" stroke-width="2"/>

  <!-- Top Panel -->
  <path d="M 106 130 L 106 86 C 106 66 122 50 142 50 L 370 50 C 390 50 406 66 406 86 L 406 130 Z" fill="#111317"/>
  <rect x="296" y="74" width="80" height="36" rx="8" fill="#05070a"/>
  <text x="336" y="97" font-family="monospace" font-size="18" font-weight="bold" fill="#22b263" text-anchor="middle">0:42</text>
  <circle cx="230" cy="92" r="16" fill="#1e222a" stroke="#363c48" stroke-width="3"/>
  <line x1="230" y1="78" x2="230" y2="84" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Door Outer Ring -->
  <circle cx="256" cy="276" r="100" fill="#14171d"/>
  <circle cx="256" cy="276" r="82" fill="#202530"/>
  <circle cx="256" cy="276" r="68" fill="url(#glass)"/>

  <!-- Laundry Circles -->
  <circle cx="238" cy="268" r="22" fill="#ea4335"/>
  <circle cx="272" cy="282" r="20" fill="#4285f4"/>
  <circle cx="256" cy="252" r="16" fill="#fbbc05"/>

  <!-- Animated Ring Effect -->
  <circle cx="256" cy="276" r="88" fill="none" stroke="#2f80ed" stroke-width="8" stroke-linecap="round" stroke-dasharray="140 90"/>
</svg>
